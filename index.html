<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק פרופילים ומובילים</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <button onclick="goToHome()" class="btn-home" title="חזרה לבית">🏠 בית</button>
        <h1 id="app-title">משחק הפרופילים</h1>
    </header>

    <main class="container">

        <section id="home-screen" class="screen active">
            <h2>ברוכים הבאים!</h2>
            <p>בחר אפשרות מהתפריט כדי להתחיל:</p>
            <div class="menu-buttons">
                <button onclick="showScreen('profile-screen')">ניהול פרופיל ואווטאר</button>
                <button onclick="showScreen('host-screen')">אזור המנחים</button>
                <button onclick="showScreen('leaderboard-screen')">טבלת מובילים ופודיום</button>
            </div>
        </section>

        <section id="profile-screen" class="screen">
            <h2>בחירת פרופיל ואווטאר</h2>
            <p>בחר את האווטאר המועדף עליך:</p>
            <div id="avatar-grid" class="avatar-grid"></div>
            <p id="selected-avatar-text">טרם נבחר פרופיל</p>
        </section>

        <section id="host-screen" class="screen">
            <h2>סטאטוס מנחים</h2>
            <div id="host-display-card" class="host-card"></div>
        </section>

        <section id="leaderboard-screen" class="screen">
            <h2>טבלת ניקוד ופודיום</h2>
            
            <div class="podium-container">
                <div class="podium-step place-2" id="podium-place-2">
                    <div class="podium-rank">2</div>
                    <div class="podium-details">-</div>
                </div>
                <div class="podium-step place-1" id="podium-place-1">
                    <div class="podium-rank">1</div>
                    <div class="podium-details">-</div>
                </div>
                <div class="podium-step place-3" id="podium-place-3">
                    <div class="podium-rank">3</div>
                    <div class="podium-details">-</div>
                </div>
            </div>

            <h3>כל השחקנים</h3>
            <div id="leaderboard-list" class="leaderboard-list"></div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
